# nginx site for apps.handsoffretail.com: client reporting dashboard + reporting APIs (single file).
# Install:
#   sudo cp infra/nginx/apps.conf /etc/nginx/sites-available/apps.handsoffretail.com
#   sudo ln -s /etc/nginx/sites-available/apps.handsoffretail.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d apps.handsoffretail.com   # adds https (443), certificate and http->https redirect
# Uses the login rate-limit zone "hor_auth_login" defined in the auth.handsoffretail.com site (do not define it again).

server {
    listen 80;
    listen [::]:80;
    server_name apps.handsoffretail.com;

    # Client dashboard (built with base /)
    root /opt/hor/store-automation/hor-reporting/client-dashboard/dist;
    index index.html;

    # Auth API on this host too, so login/refresh/logout stay same-origin (cookies)
    location = /api/auth/login {
        limit_req zone=hor_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8091/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8091/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Verifone reporting: /svc/verifone/api/... -> 127.0.0.1:8094/api/...  (prefix stripped, like the Vite dev proxy)
    location /svc/verifone/ {
        proxy_pass http://127.0.0.1:8094/;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Gilbarco reporting: /svc/gilbarco/api/... -> 127.0.0.1:8095/api/...
    location /svc/gilbarco/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Dashboard routes -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
