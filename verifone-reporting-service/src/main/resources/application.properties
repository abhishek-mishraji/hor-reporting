# verifone-reporting-service: reporting and analytics for Verifone stores.
spring.application.name=verifone-reporting-service
spring.config.import=optional:file:.env[.properties]

server.port=8094
server.address=127.0.0.1
server.shutdown=graceful

spring.jackson.default-property-inclusion=non_null

# Security & JWKS configuration
hor.auth.client.jwks-uri=${HOR_AUTH_JWKS_URI:http://127.0.0.1:8091/api/auth/.well-known/jwks.json}
hor.auth.client.allowed-origins=${HOR_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:5183,http://127.0.0.1:5183}

# Database connection pool settings (development: auth_svc user owns all databases)
hor.reporting.db.host=${HOR_DB_HOST:localhost}
hor.reporting.db.port=${HOR_DB_PORT:5432}
hor.reporting.db.username=${HOR_DB_USERNAME:auth_svc}
hor.reporting.db.password=${HOR_DB_PASSWORD}

hor.reporting.auth-db.name=${HOR_AUTH_DB_NAME:auth_db}
hor.reporting.verifone-db.name=${HOR_VERIFONE_DB_NAME:verifone_db}

# Hikari pool limits (read-only queries)
hor.reporting.hikari.maximum-pool-size=10
hor.reporting.hikari.minimum-idle=2
hor.reporting.hikari.idle-timeout=300000
hor.reporting.hikari.connection-timeout=20000
